<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ryftipe isolated JS engine</title></head><body><script>
'use strict';
let token='',active=false,nextID=0,scheduled=false,pageURL='',fetchSequence=0;
const pendingFetch=new Map();
const CAP=1800;
const observer=new MutationObserver(()=>{if(active&&!scheduled){scheduled=true;setTimeout(()=>{scheduled=false;snapshot();},110);}});
let observedShadows=new WeakSet();
function watchShadow(root){if(!root||observedShadows.has(root))return;observedShadows.add(root);observer.observe(root,{subtree:true,childList:true,attributes:true,characterData:true});}
const attachShadow=Element.prototype.attachShadow;
Element.prototype.attachShadow=function(options){const root=attachShadow.call(this,options);if(options?.mode==='open'){watchShadow(root);queueMicrotask(()=>snapshot());}return root;};
function pack(node,depth=0,limit={count:0}){
 if(depth>40||limit.count++>CAP)return null;
 if(node.nodeType===3)return {text:node.textContent.slice(0,4000)};
 if(node.nodeType!==1)return null;
 if(['script','style','iframe','object','embed','svg','canvas'].includes(node.localName))return null;
 if(!node.__rteId)node.__rteId=++nextID;
 const attrs={};for(const a of [...node.attributes].slice(0,30))if(!a.name.startsWith('on'))attrs[a.name]=a.value.slice(0,500);
 const children=[...node.childNodes];
 if(node.shadowRoot){watchShadow(node.shadowRoot);children.push(...node.shadowRoot.childNodes);}
 return {tag:node.localName,rteId:node.__rteId,attrs,children:children.map(n=>pack(n,depth+1,limit)).filter(Boolean)};
}
function snapshot(){if(active){const body=pack(document.body);parent.postMessage({type:'rte-snapshot',token,body,title:document.title},'*');}}
function mount(tree,title,url){
 pageURL=String(url||'');
 for(const settle of pendingFetch.values())settle({error:'Navigation cancelled'});
 pendingFetch.clear();
 active=false;observer.disconnect();observedShadows=new WeakSet();document.body.replaceChildren();
 document.title=String(title||'RTE').slice(0,120);nextID=0;
 function make(node,depth=0){
  if(depth>40)return document.createTextNode('');
  if(Object.hasOwn(node,'text'))return document.createTextNode(String(node.text).slice(0,4000));
  const tag=/^[a-z][a-z0-9-]*$/.test(node.tag||'')?node.tag:'span';
  const el=document.createElement(tag);el.__rteId=++nextID;
  for(const [k,v] of Object.entries(node.attrs||{})){
   if(!/^[a-z][a-z0-9:_-]*$/i.test(k)||k.startsWith('on')||k==='srcdoc')continue;
   try{el.setAttribute(k,String(v).slice(0,500));}catch{}
  }
  for(const ch of (node.children||[]).slice(0,500))el.appendChild(make(ch,depth+1));
  return el;
 }
 function add(node){if(!node)return;if(node.tag==='document'||node.tag==='html'||node.tag==='body'){for(const ch of node.children||[])add(ch);}else if(node.tag!=='head')document.body.appendChild(make(node));}
 add(tree);active=true;observer.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true});snapshot();
}
function byId(id){const queue=[document.body];let steps=0;while(queue.length&&steps++<CAP*2){const el=queue.shift();if(el.__rteId===id)return el;queue.push(...el.children);if(el.shadowRoot)queue.push(...el.shadowRoot.children);}return null;}
// A restricted fetch bridge for basic site JSON/text APIs. No credentials or POST.
window.fetch=(input,options={})=>{
 const method=String(options?.method||'GET').toUpperCase();
 if(method!=='GET')return Promise.reject(new TypeError('RTE network bridge currently supports GET only'));
 const raw=typeof input==='string'?input:input?.url;
 let absolute;
 try{absolute=new URL(String(raw),pageURL);if(absolute.origin!==new URL(pageURL).origin)throw Error('Cross-origin request');}
 catch{return Promise.reject(new TypeError('RTE only allows same-origin requests'));}
 return new Promise((resolve,reject)=>{
  const id=++fetchSequence;
  pendingFetch.set(id,result=>{
   if(result.error){reject(new TypeError(result.error));return;}
   resolve(new Response(result.body,{status:result.status||200,headers:{'Content-Type':result.contentType||'text/plain'}}));
  });
  parent.postMessage({type:'rte-fetch',token,id,url:absolute.href,method},'*');
  setTimeout(()=>{if(pendingFetch.has(id)){pendingFetch.delete(id);reject(new TypeError('RTE request timed out'));}},13000);
 });
};
window.addEventListener('message',e=>{
 if(e.source!==parent)return;
 const m=e.data;if(!m||m.type!=='rte-command'||typeof m.token!=='string'||m.token.length>90)return;
 if(m.action==='load'){token=m.token;mount(m.tree,m.title,m.url);parent.postMessage({type:'rte-ready',token},'*');return;}
 if(!active||m.token!==token)return;
 if(m.action==='fetch-result'){const settle=pendingFetch.get(Number(m.id));if(settle){pendingFetch.delete(Number(m.id));settle(m);}return;}
 if(m.action==='run'){
  if(typeof m.code!=='string'||m.code.length>180000)return;
  if(m.scriptType==='module-graph'){
   const blobURLs=new Map();
   try{
    if(!Array.isArray(m.modules)||m.modules.length>25)throw Error('Invalid module graph');
    const imports=/\b(?:import\s*(?:[\w*{},\s]+\s+from\s*)?|export\s+(?:(?:\*|\{[^}]*\})\s+from\s*))(['"])([^'"\n]+)\1/g;
    for(const record of m.modules){
     if(typeof record.source!=='string'||record.source.length>160000)throw Error('Module size limit');
     const replacements=[];
     for(const match of record.source.matchAll(imports)){
      const dependency=record.dependencies?.find(item=>item.specifier===match[2]);
      const blob=dependency&&blobURLs.get(dependency.url);
      if(!blob)throw Error('Unresolved module dependency');
      const start=match.index+match[0].lastIndexOf(match[1]+match[2]+match[1])+1;
      replacements.push({start,end:start+match[2].length,blob});
     }
     let source=record.source;
     for(const replacement of replacements.reverse()){
      source=source.slice(0,replacement.start)+replacement.blob+source.slice(replacement.end);
     }
     blobURLs.set(record.url,URL.createObjectURL(new Blob([source],{type:'text/javascript'})));
    }
    const entry=blobURLs.get(m.entryURL);
    if(!entry)throw Error('Missing module entry');
    import(entry).then(()=>parent.postMessage({type:'rte-executed',token,ok:true},'*'))
     .catch(err=>parent.postMessage({type:'rte-executed',token,ok:false,error:String(err.message).slice(0,140)},'*'))
     .finally(()=>{for(const url of blobURLs.values())URL.revokeObjectURL(url);snapshot();});
   }catch(err){
    for(const url of blobURLs.values())URL.revokeObjectURL(url);
    parent.postMessage({type:'rte-executed',token,ok:false,error:String(err.message).slice(0,140)},'*');
   }
  }else if(m.scriptType==='module'){
   const blob=new Blob([m.code],{type:'text/javascript'}),url=URL.createObjectURL(blob);
   import(url).then(()=>parent.postMessage({type:'rte-executed',token,ok:true},'*')).catch(err=>parent.postMessage({type:'rte-executed',token,ok:false,error:String(err.message).slice(0,120)},'*')).finally(()=>URL.revokeObjectURL(url));
  }else{
   try{const s=document.createElement('script');s.textContent=m.code;document.body.append(s);s.remove();parent.postMessage({type:'rte-executed',token,ok:true},'*');}
   catch(err){parent.postMessage({type:'rte-executed',token,ok:false,error:String(err.message).slice(0,120)},'*');}
  }
  snapshot();
 } else if(m.action==='lifecycle'){
  document.dispatchEvent(new Event('DOMContentLoaded',{bubbles:true}));
  window.dispatchEvent(new Event('load'));
  snapshot();
 } else if(m.action==='event'){
  const el=byId(Number(m.id));if(el){el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));snapshot();}
 }
});
parent.postMessage({type:'rte-loaded'},'*');
</script></body></html>
