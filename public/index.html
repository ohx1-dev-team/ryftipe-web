<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryftipe</title><link rel="stylesheet" href="/style.css"></head>
<body><section id="login" class="login" hidden><div class="login-box"><div class="brand">◈ Ryftipe</div><p>Remote Chromium · v0.1.1</p><form id="login-form"><input id="password" type="password" placeholder="Access password" required autocomplete="current-password"><button>Open browser</button></form><p id="login-error" class="error"></p></div></section>
<div id="browser" hidden><header><div class="tabs"><div class="tab">◈ &nbsp; Ryftipe <span>×</span></div><div class="version">v0.1.1</div></div><div class="toolbar"><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><form id="url-form"><span>◎</span><input id="url" spellcheck="false" autocomplete="off" aria-label="Website address" value="https://example.com"></form><button id="disconnect" title="Sign out">⏻</button></div></header><div id="status">Connecting to Chromium…</div><main id="screen"><img id="frame" alt="Remote Chromium browser screen" draggable="false" tabindex="0"></main><footer><span id="connection">● Connecting</span><span>Remote Chromium · Ryftipe OHx1</span></footer></div><script src="/app.js" type="module"></script></body></html>
