name: Publish Ryftipe release
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'server.js'
      - 'public/**'
      - 'rte/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original Ryftipe engine
        run: npm test
      - name: Install browser smoke dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-level RTE smoke test
        run: node tests/browser-smoke.mjs
      - name: Read version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Publish release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Ryftipe v$VERSION" --generate-notes
